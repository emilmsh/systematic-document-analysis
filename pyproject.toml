[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-document-analysis"
version = "0.7.0"
description = "Auditable document analysis in English and Norwegian, for Codex and Claude Code."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "pypdf>=6",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pymupdf>=1.26",
]

[project.scripts]
sda = "kildeanalyse.__main__:main"
kildeanalyse = "kildeanalyse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
