[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oe-kildeanalyse"
version = "0.5.0"
description = "Etterprøvbare lesekjøringer for Claude Code og Codex: plugin med lokal kjørekomponent (MCP-server i Python)."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "pypdf>=6",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pymupdf>=1.26",
]

[project.scripts]
kildeanalyse = "kildeanalyse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
