[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-document-analysis"
version = "0.10.2"
description = "One repeatable task per file, with controlled CLI/API workers and an audit trail."
authors = [{name = "Emil Mathias Strøm Halseth"}]
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "pypdf>=6",
  "pypdfium2>=4.30,<6",
  "Pillow>=11,<13",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pymupdf>=1.26",
]

[project.scripts]
sda = "kildeanalyse.__main__:main"
kildeanalyse = "kildeanalyse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
